name: Build & Release Android App

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        continue-on-error: true
        id: build

      - name: Save build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p .github/debug
          tail -n 200 /tmp/build.log > .github/debug/last-build-log.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .github/debug/last-build-log.txt
          git commit -m "Save failed Android build log [skip ci]" || true
          git push || true

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Locate and rename APK
        id: apk
        run: |
          echo "--- contents of debug output dir ---"
          find android/app/build/outputs -type f -name "*.apk" || true
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found." > /tmp/apk-locate.log
            find android/app/build/outputs -type f >> /tmp/apk-locate.log 2>&1 || true
            mkdir -p .github/debug
            cp /tmp/apk-locate.log .github/debug/last-build-log.txt
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add .github/debug/last-build-log.txt
            git commit -m "Save APK-locate failure log [skip ci]" || true
            git push || true
            exit 1
          fi
          cp "$APK_PATH" moonlight-cloud-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Moonlight Cloud Mobile — Newly Released
          body: |
            **Moonlight Cloud for Android**

            This is the newly released Moonlight Cloud mobile app — the whole site, wrapped as a native Android app. Sign in with Google directly from within the app.

            This project is **open source** and currently in **beta**. If you run into any issues, please submit your [issue](https://github.com/moonhpro4/Moonlight-Cloud/issues/new).

            ⚠️ This is a **debug build for sideloading only** — not on the Play Store. You'll need to allow "install from unknown sources" to install it.

            Built automatically from commit ${{ github.sha }}.
          files: moonlight-cloud-debug.apk
          draft: false
          prerelease: true
