plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace "com.moonlightcloud.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.moonlightcloud.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    // Chrome Custom Tabs — used to open /mobilelogin in a real browser context,
    // since Google blocks its sign-in flow inside embedded WebViews.
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.android.material:material:1.12.0"
}
